services:
  # Kafka Service ( for now start separately)
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    restart: always

  # Morpheus Service
  morpheus:
    image: jeremyguo2000/guo-morpheus:latest
    runtime: nvidia
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "source activate morpheus && python /workspace/ptc_phishing/run.py"
    stdin_open: true
    tty: true
    restart: always

  # Prometheus Service
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: always

  # Grafana Service
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana

  # Triton Inference Server
  triton:
    image:  jeremyguo2000/guo-triton:latest
    container_name: triton
    runtime: nvidia
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    command: >
      tritonserver --model-repository=/models/triton-model-repo
      --exit-on-error=false
      --log-info=true
      --log-file="gimmelogs.txt"
      --log-verbose=3
      --strict-readiness=false
      --disable-auto-complete-config
      --model-control-mode=explicit
      --load-model=phishing-bert-onnx
    restart: always

volumes:
  prometheus_data:
  grafana_data:
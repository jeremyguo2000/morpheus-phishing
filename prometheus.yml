global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']  # Prometheus service

  - job_name: 'kafka-classifier-exporter'
    static_configs:
      - targets: ['10.254.50.50:9033']  # Reference the host machine's Python exporter

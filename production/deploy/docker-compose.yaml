# Local development stack. NOT a production topology (see docs/DESIGN.md §8):
# production runs >=3 brokers with replication factor 3 and min.insync.replicas=2.
#
#   docker compose -f deploy/docker-compose.yaml up -d
#   phishguard synth /tmp/corpus && for f in /tmp/corpus/*/*.eml; do phishguard ingest < "$f"; done
services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly, with chosen settings
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka_data:/var/lib/kafka/data"]  # the PoC had no volume: a restart lost every record
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 10s
      retries: 10

  create-topics:
    image: apache/kafka:3.9.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in email-security output-email-classifications email-security-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$t" --partitions 6 --replication-factor 1 \
            --config retention.ms=604800000   # 7 days: email content is sensitive, don't keep it forever
        done

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["phishguard", "worker"]
    depends_on: { create-topics: { condition: service_completed_successfully } }
    environment:
      PHISHGUARD_BOOTSTRAP_SERVERS: kafka:19092
      PHISHGUARD_TRUSTED_AUTHSERV_IDS: ${PHISHGUARD_TRUSTED_AUTHSERV_IDS:-}
    ports: ["9033:9033"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}  # no default credentials
    ports: ["3000:3000"]
    volumes: ["grafana_data:/var/lib/grafana"]

volumes:
  kafka_data:
  grafana_data:

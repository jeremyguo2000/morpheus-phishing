[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Reference implementation: hardening the Morpheus phishing PoC for production"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.3",      # librdkafka: idempotent producer, delivery reports, manual commits
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
# Only needed if you point the worker at a real Triton server.
triton = ["tritonclient[http]>=2.40", "transformers>=4.38", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["kafka: end-to-end tests against librdkafka's in-process mock cluster"]
